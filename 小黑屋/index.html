<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小黑屋</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --bg-sidebar: #0f0f0f;
    --text: #c8c8c8;
    --text-dim: #666;
    --accent: #8b2500;
    --accent-glow: #a03000;
    --border: #1a1a1a;
    --hover: #151515;
    --active: #1a0a0a;
    --toolbar-bg: rgba(15,15,15,0.85);
    --font-size: 16px;
    --vignette-opacity: 1;
  }

  .day-mode {
    --bg: #f5f0e8;
    --bg-sidebar: #ebe6de;
    --text: #2c2c2c;
    --text-dim: #888;
    --accent: #8b2500;
    --accent-glow: #a03000;
    --border: #d5d0c8;
    --hover: #eae5dd;
    --active: #f0e8d8;
    --toolbar-bg: rgba(235,230,222,0.9);
    --vignette-opacity: 0.4;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', 'STSong', serif;
    font-size: var(--font-size);
    line-height: 2;
    display: flex;
    min-height: 100vh;
    transition: background 0.4s, color 0.4s;
  }

  ::selection { background: rgba(139,37,0,0.35); color: #fff; }
  ::-moz-selection { background: rgba(139,37,0,0.35); color: #fff; }

  /* ── Progress Bar ── */
  .progress-bar {
    position: fixed;
    top: 0; left: 260px; right: 0;
    height: 2px;
    z-index: 200;
    background: transparent;
    transition: left 0.3s;
  }
  .progress-bar .fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    transition: width 0.1s linear;
  }

  /* ── Vignette ── */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    opacity: var(--vignette-opacity);
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
    transition: opacity 0.4s;
  }

  /* ── Noise Texture ── */
  .noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 51;
    opacity: 0.035;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 180px;
  }
  .day-mode .noise { opacity: 0.02; }

  /* ── Sidebar ── */
  .sidebar {
    position: fixed;
    top: 0; left: 0;
    width: 260px;
    height: 100vh;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 40px 0 20px;
    display: flex;
    flex-direction: column;
    z-index: 100;
    transition: transform 0.3s, background 0.4s;
  }
  .sidebar-header {
    padding: 0 28px 30px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .sidebar-header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 6px;
    margin-bottom: 6px;
  }
  .sidebar-header p {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }
  .nav-list {
    list-style: none;
    flex: 1;
    overflow-y: auto;
    padding: 10px 0;
  }
  .nav-group-label {
    padding: 12px 28px 6px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .nav-list li[data-idx] {
    padding: 10px 28px 10px 36px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-dim);
    transition: all 0.2s;
    border-left: 3px solid transparent;
    letter-spacing: 1px;
    position: relative;
  }
  .nav-list li[data-idx]:hover {
    background: var(--hover);
    color: var(--text);
  }
  .nav-list li[data-idx].active {
    background: var(--active);
    color: var(--accent);
    border-left-color: var(--accent);
  }
  .nav-list li[data-idx]::after {
    content: '';
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .nav-list li[data-idx].visited::after { opacity: 0.4; }
  .nav-list li[data-idx].active::after { opacity: 0; }
  .sidebar-footer {
    padding: 16px 28px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    line-height: 1.8;
  }

  /* ── Main Content ── */
  .main {
    margin-left: 260px;
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 40px 80px;
    transition: margin-left 0.3s;
  }
  .article-wrap {
    max-width: 680px;
    width: 100%;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  .article-wrap h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
    letter-spacing: 4px;
  }
  .article-subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  .article-meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 40px;
    letter-spacing: 1px;
    opacity: 0.7;
  }
  .article-wrap p {
    text-indent: 2em;
    margin-bottom: 0.8em;
    text-align: justify;
  }
  .article-wrap p.no-indent { text-indent: 0; }
  .article-wrap p.drop-cap::first-letter {
    float: left;
    font-size: 3.2em;
    line-height: 0.85;
    padding-right: 8px;
    padding-top: 6px;
    color: var(--accent);
    font-weight: 700;
  }
  .article-wrap hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 40px auto;
    width: 60px;
  }
  .article-wrap strong {
    color: var(--accent-glow);
    font-weight: 700;
  }
  .end-mark {
    text-align: center;
    margin-top: 60px;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 4px;
  }

  /* ── Next Story Prompt ── */
  .next-prompt {
    display: none;
    margin-top: 60px;
    padding: 30px;
    text-align: center;
    border-top: 1px solid var(--border);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s, transform 0.5s;
  }
  .next-prompt.show { display: block; }
  .next-prompt.visible { opacity: 1; transform: translateY(0); }
  .next-prompt .label {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .next-prompt .next-btn {
    display: inline-block;
    padding: 10px 28px;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.3s;
    font-family: inherit;
    background: none;
  }
  .next-prompt .next-btn:hover {
    background: var(--accent);
    color: #fff;
  }

  /* ── Back to Top ── */
  .back-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--toolbar-bg);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    z-index: 150;
    pointer-events: none;
  }
  .back-top.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .back-top:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Toolbar ── */
  .toolbar {
    position: fixed;
    top: 16px;
    right: 20px;
    display: flex;
    gap: 6px;
    z-index: 200;
    background: var(--toolbar-bg);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    transition: background 0.4s, border-color 0.4s;
  }
  .toolbar button {
    background: none;
    border: 1px solid transparent;
    color: var(--text-dim);
    font-size: 14px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    line-height: 1.4;
  }
  .toolbar button:hover {
    color: var(--text);
    border-color: var(--border);
    background: var(--hover);
  }

  /* ── Mobile Toggle ── */
  .sidebar-toggle {
    display: none;
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 300;
    background: var(--toolbar-bg);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    transition: background 0.4s;
  }
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 90;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .day-mode ::-webkit-scrollbar-thumb { background: #ccc; }

  /* ── Key Hint ── */
  .key-hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 10;
    pointer-events: none;
  }
  .key-hint.show { opacity: 0.4; }
  .key-hint kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 11px;
    font-family: inherit;
    margin: 0 2px;
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-toggle { display: block; }
    .overlay.show { display: block; }
    .main { margin-left: 0; padding: 70px 20px 60px; }
    .toolbar { top: 14px; right: 60px; }
    .progress-bar { left: 0; }
    .vignette { display: none; }
  }
  /* ── UI Polish Layer ── */
  :root {
    --bg: #060505;
    --bg-sidebar: rgba(12, 10, 10, 0.94);
    --text: #d4cfca;
    --text-dim: #746b67;
    --accent: #9f2a11;
    --accent-glow: #c0441f;
    --border: rgba(145, 60, 32, 0.18);
    --hover: rgba(139,37,0,0.10);
    --active: rgba(139,37,0,0.18);
    --toolbar-bg: rgba(13, 11, 11, 0.82);
    --paper: rgba(18, 15, 14, 0.54);
    --paper-border: rgba(145, 60, 32, 0.14);
    --shadow: rgba(0,0,0,0.45);
  }

  .day-mode {
    --bg: #f3ede3;
    --bg-sidebar: rgba(238, 230, 218, 0.94);
    --text: #2b2623;
    --text-dim: #83766e;
    --accent: #9b2b14;
    --accent-glow: #b33b1b;
    --border: rgba(109, 61, 38, 0.18);
    --hover: rgba(139,37,0,0.08);
    --active: rgba(139,37,0,0.12);
    --toolbar-bg: rgba(239, 231, 219, 0.86);
    --paper: rgba(255, 250, 241, 0.58);
    --paper-border: rgba(109, 61, 38, 0.16);
    --shadow: rgba(80,58,38,0.12);
  }

  body {
    background:
      radial-gradient(circle at 58% 6%, rgba(139, 37, 0, 0.12), transparent 30vw),
      radial-gradient(circle at 10% 88%, rgba(65, 14, 8, 0.16), transparent 34vw),
      linear-gradient(115deg, var(--bg), #0c0908 54%, var(--bg));
    letter-spacing: 0.01em;
  }
  .day-mode body,
  body.day-mode {
    background:
      radial-gradient(circle at 58% 6%, rgba(139, 37, 0, 0.08), transparent 30vw),
      radial-gradient(circle at 10% 88%, rgba(186, 129, 82, 0.18), transparent 34vw),
      linear-gradient(115deg, var(--bg), #fbf5eb 54%, var(--bg));
  }

  .progress-bar { height: 3px; background: rgba(0,0,0,0.16); }
  .progress-bar .fill {
    background: linear-gradient(90deg, #541407, var(--accent), #e15b2d);
    box-shadow: 0 0 14px rgba(192, 68, 31, 0.75);
  }

  .sidebar {
    box-shadow: 18px 0 40px rgba(0,0,0,0.26);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .sidebar::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(139,37,0,0.09), transparent 28%, rgba(139,37,0,0.05));
  }
  .sidebar-header { position: relative; }
  .sidebar-header h1 {
    font-size: 26px;
    text-shadow: 0 0 24px rgba(192, 68, 31, 0.22);
  }
  .sidebar-header p::before {
    content: '';
    display: inline-block;
    width: 28px;
    height: 1px;
    margin-right: 9px;
    vertical-align: middle;
    background: var(--accent);
    opacity: 0.7;
  }

  .nav-list li[data-idx] {
    margin: 3px 12px;
    border-radius: 10px;
    border-left-width: 0;
    padding-left: 24px;
  }
  .nav-list li[data-idx].active {
    box-shadow: inset 0 0 0 1px rgba(159,42,17,0.25), 0 8px 24px rgba(0,0,0,0.16);
  }
  .nav-list li[data-idx].active::before {
    content: '';
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 18px;
    border-radius: 999px;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(192,68,31,0.55);
  }
  .nav-list li[data-idx]:hover {
    transform: translateX(2px);
  }

  .main {
    padding-top: 84px;
  }
  .article-wrap {
    max-width: 740px;
    padding: 52px 56px 64px;
    border: 1px solid var(--paper-border);
    border-radius: 22px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.018), transparent 140px),
      var(--paper);
    box-shadow: 0 24px 80px var(--shadow);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    position: relative;
    overflow: hidden;
  }
  .article-wrap::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(192,68,31,0.55), transparent);
  }
  .article-wrap::after {
    content: '';
    position: absolute;
    top: -120px;
    right: -120px;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(159,42,17,0.10), transparent 68%);
    pointer-events: none;
  }
  .article-wrap h1 {
    font-size: clamp(30px, 4vw, 42px);
    letter-spacing: 0.18em;
    line-height: 1.35;
    margin-bottom: 10px;
  }
  .article-subtitle {
    display: inline-block;
    margin-bottom: 12px;
    padding: 2px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(139,37,0,0.08);
    color: var(--accent);
  }
  .article-meta {
    padding-bottom: 28px;
    margin-bottom: 34px;
    border-bottom: 1px solid var(--border);
  }
  .article-desc {
    margin: -18px 0 34px;
    padding: 18px 20px;
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    background: rgba(139,37,0,0.075);
    color: var(--text-dim);
    font-size: 0.92em;
    line-height: 1.85;
  }
  .article-wrap p {
    line-height: 2.08;
    margin-bottom: 1em;
  }
  .article-wrap p.drop-cap::first-letter {
    text-shadow: 0 0 18px rgba(192,68,31,0.25);
  }
  .article-wrap hr {
    width: 86px;
    border-top: none;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.45;
  }

  .toolbar {
    border-radius: 999px;
    padding: 7px;
    box-shadow: 0 10px 34px rgba(0,0,0,0.22);
  }
  .toolbar button {
    min-width: 38px;
    border-radius: 999px;
  }
  .toolbar button:active,
  .back-top:active,
  .next-btn:active {
    transform: scale(0.96);
  }

  .next-prompt {
    width: min(740px, 100%);
    border-radius: 18px;
    background: var(--paper);
    border: 1px solid var(--paper-border);
    box-shadow: 0 18px 50px var(--shadow);
  }
  .back-top {
    box-shadow: 0 12px 36px rgba(0,0,0,0.25);
  }

  @media (max-width: 768px) {
    .article-wrap {
      padding: 38px 24px 48px;
      border-radius: 18px;
    }
    .main { padding-top: 86px; }
  }
</style>
</head>
<body>

<!-- Vignette -->
<div class="vignette"></div>
<!-- Noise Texture -->
<div class="noise"></div>
<!-- Progress Bar -->
<div class="progress-bar"><div class="fill" id="progressFill"></div></div>

<!-- Sidebar Toggle (mobile) -->
<button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Menu">&#9776;</button>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>小黑屋</h1>
    <p>心理恐怖 · 短篇集</p>
  </div>
  <ul class="nav-list" id="navList">
    <li class="nav-group-label">雕塑三部曲</li>
    <li data-idx="0" onclick="switchTo(0)">其一</li>
    <li data-idx="1" onclick="switchTo(1)">其二</li>
    <li data-idx="2" onclick="switchTo(2)">其三</li>
    <li class="nav-group-label">独立篇</li>
    <li data-idx="3" onclick="switchTo(3)">认知坍缩</li>
    <li data-idx="4" onclick="switchTo(4)">自我校准</li>
    <li data-idx="5" onclick="switchTo(5)">回声</li>
  </ul>
  <div class="sidebar-footer">
    作者：或许我将再逝朝花<br>
    生成于 2026-06-01
  </div>
</nav>

<!-- Toolbar -->
<div class="toolbar">
  <button onclick="changeFontSize(-1)" title="缩小字号">A-</button>
  <button onclick="changeFontSize(1)" title="放大字号">A+</button>
  <button id="themeBtn" onclick="toggleTheme()" title="切换日间/夜间模式">&#9790;</button>
</div>

<!-- Main Content -->
<main class="main">
  <div id="contentArea"></div>
  <div class="next-prompt" id="nextPrompt">
    <div class="label">- 下一篇 -</div>
    <button class="next-btn" id="nextBtn"></button>
  </div>
</main>

<!-- Back to Top -->
<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="返回顶部">&#8593;</button>
<!-- Key Hint -->
<div class="key-hint" id="keyHint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> 切换</div>

<script>
// ── Story Data ──
const stories = [
{
  title: "雕塑 · 其一",
  tag: "雕塑三部曲",
  desc: "一个精确到病态的雕塑家，偶然得到一块红色陶土，被原始的创作冲动彻底吞噬。",
  html: `
<p>他曾是个雕塑家。</p>
<p>这么说或许不准确。他更像个地质学家，或者僧侣。他的工作室里闻不到一丝泥土的腥气，只有石粉干燥、冰冷的微尘。他只雕刻石头，那些没有生命的、亿万年才形成一点纹理的硬物。花岗岩、大理石。他用最精密的工具，耗费数月，磨出一个完美的球体，或者一道比尺子还直的棱线。</p>
<p>他的生活和他的作品一样，精确、光滑、没有温度。独居，无声。书架上的书按颜色和尺寸排列。厨房里的餐具用完后会立刻洗净，擦干，归位。他从不与人有超过必要的肢体接触，在街上会下意识地避开向他走来的人。他的眼神总是落在三步之外的地面，仿佛那里有他唯一能够理解的几何图形。</p>
<p>没人知道他内里是什么样子。或许什么都没有。只是一具被规律驱动的、干净的躯壳。</p>
<p>直到他得到那块泥。</p>
<p>那不是他买的。是一个做陶的朋友硬塞给他的，说你总跟死物打交道，试试这个，活的。那是一大块红色的陶土，用湿布包着，放在角落里，像一团沉默的内脏。他好几天没碰它。那东西的存在本身，就破坏了他工作室的秩序。它是有机物，会腐烂，会发霉，会散发出……气息。</p>
<p>一个雨夜，他听着窗外连绵的雨声，那种潮湿、黏腻的感觉似乎渗透了墙壁。他鬼使神差地走向那块陶土，揭开了湿布。</p>
<p>一股浓重的、混合着泥土和铁锈的气味扑面而来。他迟疑地伸出手，指尖触碰到了那片湿润的微凉。它没有反抗，而是微微下陷，包裹住了他的指尖。那是一种他从未体验过的触感。石头是拒绝，是冰冷的对抗。而这泥，是接纳，是柔软的邀请。</p>
<p>他猛地抽回了手，像是被烫到一样。</p>
<p>那天晚上，他失眠了。</p>
<p>第二天，他没碰那些石头。他只是看着那块泥。第三天也是。到了第四天夜里，他锁上了工作室的门。邻居说，那晚听见他屋里有声音，起初是均匀的撞击声，很有节奏，像在揉面。后来，那声音变得急促、混乱，夹杂着压抑的、野兽般的喘息。那声音持续了很久，最后一切归于寂静。</p>
<p>我是在一周后见到他的。他请我去看看他的"新作"。</p>
<p>工作室里一片狼藉。工具扔了一地，石粉和干掉的泥块混在一起。而他本人，瘦了一大圈，眼窝深陷，眼神里有一种被掏空后的、恍惚的平静。他身上穿着的工作服沾满了半干的红土，像是凝固的血。</p>
<p>作品在工作室的中央，用那块巨大的湿布盖着。</p>
<p>"我没烧。"他说，声音沙哑。"烧了，就死了。"</p>
<p>他走过去，用一种近乎爱抚的动作，掀开了湿布。</p>
<p>我看到它的第一眼，胃里就一阵翻涌。</p>
<p>那不是球体，不是棱线，不是任何几何图形。那是一团纠缠在一起的形体，勉强能分辨出是两个人形，但又不是。它们没有五官，没有四肢，像是从一整块泥里被强行撕扯、揉捏出来的。一个形体紧紧地、绝望地攀附着另一个，肌肉扭曲成一种痛苦和狂喜的混合体，无数用力的指印深陷在泥土里，甚至能看到一些被指甲划破的细长伤痕。</p>
<p>而最让我不寒而栗的，是它们的表面。那些被指印和划痕覆盖的地方，粗糙、暴力、充满了挣扎的痕迹。但在另一些地方，泥土的表面却异常光滑，平顺得像是被反复打磨过，甚至带着一种湿润的光泽。</p>
<p>像被舌头……舔过一样。</p>
<p>他站在作品旁边，眼神狂热又空洞。他拿起一个小喷壶，对着那些光滑的表面，轻轻地喷着水。</p>
<p>"不能让它干了。"他喃喃自语，像在对情人说话。</p>
<p>"永远不能。"</p>
<p>水珠顺着那光滑的曲面滚落，积在两个形体交合的缝隙里，像一滴无法擦去的眼泪。</p>
<p>我没敢问他，那两个人是谁。</p>
<p>我甚至没敢问他，制作它的时候，他到底是一个人，还是两个。</p>`

  html: `
<p>我是在冰冷的浴室地砖上醒来的。或者说，恢复意识的。</p>
<p>我不知道我为什么会在这里，也不知道我躺了多久。我的记忆在那个"快好了"的念头之后，就断成了一片片无法拼合的碎片。我试着回忆Anna，但她的脸在我的脑海里像一幅没干透的水彩画，五官流淌、融化，最后只剩下一团温暖的、泛着红色的颜料。</p>

<p>但那个声音还在。</p>
<p>它和心跳的频率不一样。心跳是规律的、温顺的、符合教科书的。而它是——我不知该怎么形容——它是<strong>野生的</strong>。它有自己的意志，自己的呼吸，自己的脾性。有时候它安静下来，像在打盹；有时候它突然活跃起来，连着敲出十几下，像有什么东西在试图引起我的注意。</p>
<p>它们之间唯一的共同点是位置。都在胸腔里。都在左侧第四肋间和第五肋间之间。</p>
<p>我不知道胸腔里到底装了几个东西。</p>

<hr>

<p>第十天，我辞了工作。</p>
<p>这不是一个理性的决定。我还有房租要交，有信用卡账单要还，有母亲每周日下午打来的电话要接。但我已经连续四天没有写出一行代码了。坐在电脑前，双手放在键盘上，我能感觉到指尖下面那些字母键在微微震动——不是键盘在震动，是我的手。我的血管在跳。每一次"那个东西"跳动，我的指尖就会跟着颤一下，像是被一根看不见的线牵着。</p>
<p>我不再是手指的主人。我只是它们的房东。</p>
<p>辞职之后我做的第一件事是把房间里所有能发出声音的东西都关掉了。手机静音，电脑关机，冰箱拔掉电源（压缩机的嗡嗡声让我心烦），窗户关死，窗帘拉上。我坐在客厅中央的地板上，等着。</p>
<p>安静降临。</p>
<p>然后我听见了更多的东西。</p>
<p>不只是那个。不只是胸腔里那个野生的、不规则的敲击声。我还听见了——血管里的声音。血液流过动脉壁的声音。不是你想象中的那种"潺潺流水"的诗意画面。真实的声音是粗糙的、黏稠的、充满摩擦的。像湿砂纸缓慢地拖过一块毛玻璃。像一条蛇在干燥的落叶堆里蠕动。</p>
<p>我以前从来不知道血液是这么<strong>吵</strong>的。</p>
<p>我抱住自己的脑袋，把耳朵紧紧压在肩膀上，试图用物理手段阻隔。但声源在身体里面。我无法逃离自己的身体。我可以扔掉手机，搬离城市，销声匿迹——但我永远带着这具躯体。它是唯一一件我无法脱下来的衣服。</p>

<hr>

<p>第十三天，我发现了规律。</p>
<p>那个声音——我现在已经不愿叫它"心跳"了——它不是随机的。它在回应外界的声音。</p>
<p>我做了实验。我用指关节敲了三下桌面。间隔大约一秒。然后我等待。</p>
<p>三秒后，胸腔里传来了三下敲击。间隔大约一秒。</p>
<p>我又试了一次。这次我敲了五下，节奏是"快-快-慢-快-慢"。</p>
<p>五秒后，同样的节奏从胸腔里响起。"快-快-慢-快-慢"。分毫不差。</p>
<p>它在<strong>学</strong>。</p>
<p>那天下午我坐在地板上哭了。不是因为恐惧。恐惧在第十一天左右就已经耗尽了，像一块被反复咀嚼的口香糖，最终只剩下毫无味道的胶质。我哭是因为一种更原始的情绪——<strong>孤独</strong>。我体内住着一个活的东西，它能听见我，能模仿我，能回应我，但我看不见它，摸不到它，甚至无法确定它到底是什么。它是我最亲密的邻居，和我共享同一具身体，但我对它一无所知。</p>
<p>我敲了一下地板。一下。</p>
<p>等了五秒。</p>
<p>胸腔里传来一下。</p>
<p>然后——第二下。我没有敲第二下。</p>
<p>第三下。第四下。第五下。越来越快，越来越密，像暴雨前的急促鼓点，像有什么东西终于等不及了，正在疯狂地试图从里面敲开通往外面的门。</p>
<p>我捂住胸口。</p>
<p>它停了。</p>
<p>安静了整整十七秒。</p>
<p>然后它轻轻敲了一下。很轻，很温柔，像在说：<strong>我还在这里。</strong></p>

<hr>

<p>第十五天，我决定和它谈谈。</p>
<p>我不知道该怎么和胸腔里的东西交谈。我不是声学家，也不是生物学家，我只是一个写了三年代码、存款刚够交两个月房租的普通程序员。但我已经试过了所有"正常"的办法——看医生、隔音、远离声源。没有用。它在我体内。它就是我。或者说，我就是它。</p>
<p>我坐在窗边。这是十天以来我第一次拉开窗帘。阳光照进来，落在我的手上。我低头看自己的手——指节分明，指甲修剪整齐，皮肤下面是青色的静脉。这是一只普通的手。这只手写过代码，洗过碗，牵过前女友的手指。它属于我。</p>
<p>我用这只手轻轻拍了一下自己的胸口。一下。</p>
<p>等。</p>
<p>它回了一下。一下。</p>
<p>我拍了两下。</p>
<p>它回了两下。</p>
<p>我深吸一口气，然后用一种连我自己都觉得荒谬的、轻柔的语气，对着自己的胸腔说：</p>
<p>"你好。"</p>
<p>沉默。</p>
<p>蝉鸣。远处有汽车喇叭声。楼下有人在遛狗，狗链哗啦哗啦地响。</p>
<p>然后，胸腔里发出了一声——我不确定该怎么描述它。它不是一个音节，不是一个单词，不是任何一种人类语言能发出的声音。它更像是一个<strong>振动</strong>。从胸骨的最深处传出来，穿过肋骨、穿过肌肉、穿过皮肤，最终抵达空气。那个振动的频率很低，低到几乎在听觉的边缘，像地球本身在叹息。</p>
<p>但它是有含义的。我不知道我是怎么理解的——我没有听见任何词，没有看见任何画面，没有接收到任何可以翻译成中文或英文的信号——但我<strong>知道</strong>了它说的话。</p>
<p>它说：<strong>痛。</strong></p>

<hr>

<p>第十六天，我开始感到痛了。</p>
<p>不是胸腔里的东西在伤害我。是我自己的身体在痛。是一种以前从未注意过的、一直存在但被大脑过滤掉的痛。膝盖里的半月板在每一次弯曲时发出的微小抗议。脊椎间盘被重力缓缓压缩的钝痛。眼角膜因为长时间注视屏幕而积累的干涩。牙齿咬合时颞下颌关节的轻微错位。</p>
<p>这些痛一直都在。每一秒，每一刻，这具身体都在以一种极其缓慢的速度崩塌。只是大脑太擅长忽略了——它把99%的疼痛信号拦截在意识的门槛之外，只让最重要的那1%通过，好让你在被开水烫到时能及时缩手。</p>
<p>但那个东西拆掉了门槛。</p>
<p>现在我能感觉到<strong>一切</strong>。脚趾在鞋子里被挤压的不适。裤子松紧带在腰间勒出的那道浅浅的压痕。空气进入鼻腔时鼻毛的轻微刺痒。舌头在口腔里无处安放的局促——你有没有注意过，当你突然意识到舌头的存在时，你就再也找不到一个舒服的位置来放它了？</p>
<p>这具身体是一个永远无法完工的建筑工地。每一秒都有砖块松动，有钢筋锈蚀，有墙皮剥落。而我以前竟然对此毫无察觉。</p>
<p>那个东西在教我<strong>看见</strong>自己。</p>

<hr>

<p>第十八天。</p>
<p>我坐在地板上，已经很久没有出门了。外卖盒子堆在门口。窗帘拉开了一半，夕阳把房间切成两半，一半橙红，一半灰蓝。</p>
<p>我没有再和它"交谈"。不是因为不想，是因为已经不需要了。我不再敲击桌面来诱导它回应，不再对着胸腔说话。我只是安静地坐着，听。</p>
<p>它还在那里。一下，一下，一下。野生的、不规则的、有自己脾性的。但现在我不再试图压制它、忽略它、用白噪音覆盖它。我让它跳。它跳它的，我呼吸我的。</p>
<p>今天下午发生了一件事。我坐在窗边看夕阳，看光线一寸一寸地从地板上退去。退到我脚边的时候，我突然注意到——我的心跳，那个72次每分钟、节律齐、没有杂音的"正常"心跳，和胸腔里那个野生的敲击声，在某一个瞬间，重合了。</p>
<p>只有一瞬间。不到一秒。</p>
<p>两个节奏——一个属于教科书，一个属于旷野——在那一个瞬间里，发出了同一个声音。</p>
<p>然后它们又分开了。各走各的路。</p>
<p>我不知道这意味着什么。也许什么都不意味。也许身体里本来就有两个鼓手，一个打节拍，一个即兴演奏，它们偶尔会在某一小节里踩到同一个点，然后继续各自漫游。</p>
<p>我低头看着自己的手。夕阳最后的余光落在手背上，血管在皮肤下面隐约可见，青色的河流在薄薄的表皮下安静地流淌。</p>
<p>我以前从来没有这么仔细地看过自己的手。</p>
<p>它还在跳。胸腔里那个东西。它没有停，也没有要停的意思。它不属于我，但它在我体内。我无法驱逐它，就像我无法驱逐自己的影子。</p>
<p>但我不再害怕了。</p>
<p>也许是因为我已经没有多余的力气来害怕了。也许是因为当你和一个东西在同一具身体里共处了十八天之后，恐惧就会像晨雾一样自然地蒸发。也许是因为——</p>
<p>我听见它又敲了一下。很轻。</p>
<p>像是在说：<strong>还在。</strong></p>
<p>我闭上眼睛。</p>
<p>夕阳沉下去了。房间暗下来。远处有晚归的鸟在叫，楼下有人在喊孩子回家吃饭。</p>
<p>我坐在黑暗里，听着自己胸腔中两个心脏——不，一个心脏和一个别的什么——此起彼伏地跳动。</p>
<p>一个打节拍。</p>
<p>一个即兴演奏。</p>
<p>我以前觉得安静是没有声音。现在我知道了。安静是所有声音同时响起，而你终于不再试图让它们闭嘴。</p>
<p class="no-indent end-mark">[ 完 ]</p>`
}
];

// ── State ──
const SIZES = [14, 16, 18];
let sizeIdx = parseInt(localStorage.getItem('xhw-sizeIdx') || '1', 10);
let isDark = localStorage.getItem('xhw-dark') !== 'false';
let currentIdx = parseInt(localStorage.getItem('xhw-idx') || '0', 10);
let visited = JSON.parse(localStorage.getItem('xhw-visited') || '{}');
let scrollPos = JSON.parse(localStorage.getItem('xhw-scroll') || '{}');
let keyHintTimer = null;

// ── Helpers ──
function countChars(html) {
  return html.replace(/<[^>]*>/g, '').replace(/\s/g, '').length;
}

// ── Init ──
function init() {
  applyFontSize();
  applyTheme();
  switchTo(currentIdx, false, true);
  setupScrollTracking();
  // Show key hint briefly
  const kh = document.getElementById('keyHint');
  kh.classList.add('show');
  setTimeout(() => kh.classList.remove('show'), 4000);
}

function switchTo(idx, animate, restoring) {
  if (idx < 0 || idx >= stories.length) return;

  // Save scroll position of current story before leaving
  if (!restoring && currentIdx !== undefined) {
    scrollPos[currentIdx] = window.scrollY;
    localStorage.setItem('xhw-scroll', JSON.stringify(scrollPos));
  }

  currentIdx = idx;
  localStorage.setItem('xhw-idx', idx);

  // Mark visited
  visited[idx] = true;
  localStorage.setItem('xhw-visited', JSON.stringify(visited));

  // Update nav
  document.querySelectorAll('.nav-list li[data-idx]').forEach(li => {
    const i = parseInt(li.dataset.idx);
    li.classList.toggle('active', i === idx);
    li.classList.toggle('visited', visited[i] && i !== idx);
  });

  // Render
  const s = stories[idx];
  const chars = countChars(s.html);
  const mins = Math.max(1, Math.round(chars / 500));
  const area = document.getElementById('contentArea');
  const nextPrompt = document.getElementById('nextPrompt');
  area.style.animation = 'none';
  area.offsetHeight; // reflow

  // Find first <p> to add drop-cap
  let htmlOut = s.html;
  const firstPIdx = htmlOut.indexOf('<p>');
  if (firstPIdx !== -1) {
    htmlOut = htmlOut.slice(0, firstPIdx) + '<p class="drop-cap"' + htmlOut.slice(firstPIdx + 3);
  }

  area.innerHTML = `
    <div class="article-wrap" ${animate !== false ? 'style="animation:fadeUp .6s cubic-bezier(0.22,1,0.36,1) forwards"' : ''}>
      <h1>${s.title}</h1>
      <div class="article-subtitle">${s.tag}</div>
      <div class="article-meta">${chars} 字 · 约 ${mins} 分钟</div>
      <div class="article-desc">${s.desc}</div>
      ${htmlOut}
    </div>
  `;

  // Setup next story prompt
  if (idx < stories.length - 1) {
    const next = stories[idx + 1];
    nextPrompt.querySelector('.label').textContent = '- 下一篇 -';
    const btn = nextPrompt.querySelector('.next-btn');
    btn.textContent = next.title;
    btn.onclick = () => switchTo(idx + 1);
    nextPrompt.classList.add('show');
    nextPrompt.classList.remove('visible');
  } else {
    nextPrompt.classList.remove('show');
  }

  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');

  // Restore scroll position or go to top
  if (restoring && scrollPos[idx]) {
    requestAnimationFrame(() => window.scrollTo(0, scrollPos[idx]));
  } else {
    window.scrollTo({ top: 0, behavior: animate !== false ? 'smooth' : 'auto' });
  }
}

// ── Scroll Tracking ──
function setupScrollTracking() {
  const fill = document.getElementById('progressFill');
  const backTop = document.getElementById('backTop');
  const nextPrompt = document.getElementById('nextPrompt');

  window.addEventListener('scroll', () => {
    const st = window.scrollY;
    const docH = document.documentElement.scrollHeight - window.innerHeight;
    const pct = docH > 0 ? Math.min(100, (st / docH) * 100) : 0;
    fill.style.width = pct + '%';

    // Back to top
    backTop.classList.toggle('show', st > 400);

    // Next prompt visible when near bottom
    if (nextPrompt.classList.contains('show')) {
      nextPrompt.classList.toggle('visible', pct > 85);
    }
  }, { passive: true });
}

function changeFontSize(dir) {
  sizeIdx = Math.max(0, Math.min(SIZES.length - 1, sizeIdx + dir));
  localStorage.setItem('xhw-sizeIdx', sizeIdx);
  applyFontSize();
}

function applyFontSize() {
  document.documentElement.style.setProperty('--font-size', SIZES[sizeIdx] + 'px');
}

function toggleTheme() {
  isDark = !isDark;
  localStorage.setItem('xhw-dark', isDark);
  applyTheme();
}

function applyTheme() {
  document.body.classList.toggle('day-mode', !isDark);
  document.getElementById('themeBtn').innerHTML = isDark ? '&#9790;' : '&#9728;';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') switchTo(currentIdx - 1);
  if (e.key === 'ArrowRight') switchTo(currentIdx + 1);
});

// ── Go ──
init();
</script>
